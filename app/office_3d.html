  const panel = document.getElementById('panel'), grow = document.getElementById('grow'), box = document.getElementById('text');
  try { if (localStorage.getItem('office_full') === '1') panel.classList.add('full'); } catch (e) {}
  grow.onclick = () => { panel.classList.toggle('full');
    try { localStorage.setItem('office_full', panel.classList.contains('full') ? '1' : '0'); } catch (e) {} };
  const fit = () => { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight + 2, window.innerHeight * 0.4) + 'px'; };
  box.addEventListener('input', fit);
  document.getElementById('form').addEventListener('submit', () => setTimeout(fit, 0));
})();
</script>
</body>
</html>
