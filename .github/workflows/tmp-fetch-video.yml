name: tmp-fetch-video
on:
  push:
    branches: [tmp/fetch-jeddah-video]
permissions:
  contents: write
  actions: read
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, 'apk added')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Afaaq-Naqliat-Connector
          run-id: 41607287049
          github-token: ${{ github.token }}
          path: tmpapk
      - run: |
          ls -la tmpapk
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmpapk && git commit -m "apk added" && git push
