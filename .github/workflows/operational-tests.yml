name: Afaaq operational acceptance
on:
  push:
    paths: ['app/**', 'tests/**', 'requirements.txt', '.github/workflows/operational-tests.yml']
  pull_request:
    paths: ['app/**', 'tests/**', 'requirements.txt', '.github/workflows/operational-tests.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: afaaq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_operational_repair.py tests/test_whatsapp_admin.py tests/test_social_publishing.py -q
      - run: python tests/postgres_acceptance.py
        env:
          AFAAQ_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/afaaq_test
