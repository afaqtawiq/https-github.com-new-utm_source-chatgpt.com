name: Afaaq operational acceptance
on:
  push:
    paths: ['app/**', 'discovery_worker.py', 'tests/**', 'requirements.txt', 'Dockerfile', '.github/workflows/operational-tests.yml']
  pull_request:
    paths: ['app/**', 'discovery_worker.py', 'tests/**', 'requirements.txt', 'Dockerfile', '.github/workflows/operational-tests.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: afaaq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_customer_followup.py tests/test_customer_followup_digest.py tests/test_owner_briefing.py -q
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
      - run: python -m pytest tests/test_finance_monthly_reports.py tests/test_finance_closing_core.py tests/test_finance_claim_core.py tests/test_finance_claim_pdf.py tests/test_finance_core.py tests/test_finance_view.py tests/test_bootstrap_config.py tests/test_carrier_records.py tests/test_staff_intake.py tests/test_brochure_cadence.py tests/test_agent_monitor.py tests/test_opportunity_quality.py tests/test_operational_repair.py tests/test_zernio_whatsapp.py tests/test_whatsapp_inbox.py tests/test_whatsapp_document_store.py tests/test_whatsapp_document_transport.py tests/test_whatsapp_document_ui.py tests/test_whatsapp_document_upload_cleanup.py tests/test_whatsapp_agent.py tests/test_whatsapp_agent_store.py tests/test_whatsapp_agent_privacy.py tests/test_whatsapp_context_incremental.py tests/test_whatsapp_document_review_store.py tests/test_whatsapp_document_review_ui.py tests/test_whatsapp_outgoing_diagnostic.py tests/test_whatsapp_admin.py tests/test_manual_tracking.py tests/test_social_publishing.py tests/test_media_fal.py tests/test_media_runway.py tests/test_runway_video_provider.py tests/test_advert.py tests/test_marketing_content.py tests/test_mail_delivery.py tests/test_fasah_workspace.py tests/test_transport_phone_parsing.py tests/test_transport_disclosed.py tests/test_owner_delivery.py tests/test_broadcast_recovery.py tests/test_mail_threads.py tests/test_mail_content.py tests/test_driver_test_context.py tests/test_prospect_intro.py tests/test_manual_email_policy.py -q
      - run: python -m pytest tests/test_whatsapp_takeover.py tests/test_whatsapp_takeover_control.py tests/test_whatsapp_takeover_transport.py tests/test_whatsapp_takeover_thread_context.py tests/test_whatsapp_operator_context.py -q
        env:
          WHATSAPP_TAKEOVER_TEST_URL: postgresql://postgres:local-ci-only@localhost:5432/afaaq_test
      - run: python -m pytest tests/test_company_documents.py -q
        env:
          COMPANY_ARCHIVE_TEST_URL: postgresql://postgres:local-ci-only@localhost:5432/afaaq_test
      - run: python tests/company_archive_postgres_acceptance.py
        env:
          COMPANY_ARCHIVE_TEST_URL: postgresql://postgres:local-ci-only@localhost:5432/afaaq_test
      - run: python -m pytest tests/test_growth_acceptance_clock.py tests/test_customs_case_guidance.py tests/test_fasah_ai_accuracy.py tests/test_customs_document_qualification.py tests/test_customs_first.py tests/test_customs_qualification.py tests/test_land_export_pricing.py tests/test_prospect_replies.py tests/test_whatsapp_natural.py -q
      - run: python -m pytest tests/test_saber_knowledge.py tests/test_saber_lookup.py tests/test_saber_natural_lookup.py tests/test_saber_team_lookup.py tests/test_saber_answers.py -q
      - run: python -m pytest tests/test_daily_poster.py tests/test_daily_poster_english.py -q
      - run: python tests/daily_poster_english_postgres_acceptance.py
        env:
          AFAAQ_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/afaaq_test
      - run: python -m pytest tests/test_comment_responder.py tests/test_comment_identity.py -q
