name: Build Naqliat Connector APK
on:
  workflow_dispatch:
  push:
    paths: ['android-naqliat-connector/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: ''}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle :app:assembleDebug
        working-directory: android-naqliat-connector
      - uses: actions/upload-artifact@v4
        with:
          name: Afaaq-Naqliat-Connector
          path: android-naqliat-connector/app/build/outputs/apk/debug/app-debug.apk
      # A plain .apk the phone can install directly (the artifact above is a zip).
      - name: Publish the APK as a release download
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' android-naqliat-connector/app/build.gradle.kts | cut -d'"' -f2)
          cp android-naqliat-connector/app/build/outputs/apk/debug/app-debug.apk "Afaq-Naqliat-Connector-$VERSION.apk"
          gh release delete "naqliat-connector-v$VERSION" --yes --cleanup-tag || true
          gh release create "naqliat-connector-v$VERSION" "Afaq-Naqliat-Connector-$VERSION.apk" \
            --title "موصل نقليات $VERSION" --notes "تثبيت مباشر على أندرويد." --target "$GITHUB_SHA"
